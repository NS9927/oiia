name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# tag 推送时需要 contents:write 才能创建 Release 并上传产物
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 插件目标 JVM 工具链为 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 缓存 Gradle 依赖与包装器（含 IntelliJ 平台分发与 Marketplace 插件下载）
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # tag 必须与 gradle.properties 的版本一致，防止打错版本
      - name: Verify tag matches plugin version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          props_version=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$tag_version" != "$props_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match gradle.properties version $props_version"
            exit 1
          fi

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Build plugin
        run: ./gradlew buildPlugin --stacktrace

      # 上传生成的插件 zip
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: oiia-${{ github.sha }}
          path: build/distributions/*.zip
          if-no-files-found: error

      # tag 构建时把插件 zip 挂到对应的 GitHub Release 上（同 Shadow：已存在则直接上传）
      - name: Attach plugin to GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Oiia $tag" --generate-notes
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber build/distributions/*.zip
